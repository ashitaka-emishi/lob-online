name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest

    steps:
      # Guard: skip deploy when M8 infra secrets are not configured.
      # Requires three GitHub secrets wired before M8 goes live:
      #   DO_DROPLET_IP  — DigitalOcean Droplet IP
      #   DO_SSH_USER    — SSH user on the Droplet
      #   DO_SSH_KEY     — Private SSH key with Droplet access
      - name: Check infra secrets configured
        id: check_secrets
        run: |
          if [ -z "$DO_DROPLET_IP" ]; then
            echo "DO_DROPLET_IP secret not set — skipping deploy (M8 infra not provisioned)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          DO_DROPLET_IP: ${{ secrets.DO_DROPLET_IP }}

      - name: Deploy via SSH
        if: steps.check_secrets.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_DROPLET_IP }}
          username: ${{ secrets.DO_SSH_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/lob-online

            echo "→ Pulling latest code..."
            git pull origin master

            echo "→ Installing dependencies..."
            npm ci --omit=dev

            echo "→ Building client..."
            npm run build

            echo "→ Reloading application..."
            pm2 reload ecosystem.config.cjs --env production

            echo "✓ Deploy complete"

# Required GitHub secrets:
#   DO_DROPLET_IP  — IP address of the DigitalOcean Droplet
#   DO_SSH_USER    — SSH user on the Droplet (e.g. "deploy" or "root")
#   DO_SSH_KEY     — Private SSH key with access to the Droplet
#
# Branch protection: configure GitHub to require CI to pass before
# allowing merge to master, ensuring deploy only runs on green code.
