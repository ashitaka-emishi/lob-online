services:
  minio:
    image: minio/minio:latest
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: ${SPACES_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SPACES_SECRET:-minioadmin}
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
        $${SPACES_KEY:-minioadmin}
        $${SPACES_SECRET:-minioadmin};
      mc mb --ignore-existing local/lob-online-dev;
      echo 'Bucket ready.';
      "
