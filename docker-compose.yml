services:
  minio:
    image: minio/minio:latest
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: ${SPACES_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${SPACES_SECRET:-minioadmin}
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
